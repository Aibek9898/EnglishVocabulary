name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/project-thread-39wedl]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # With a Supabase project set up (see supabase.yml), the site uses accounts.
      - name: Find the Supabase address and public key
        env:
          REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          REF=$(printf '%s' "$REF" | tr -d '[:space:]')
          SUPABASE_ACCESS_TOKEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          if [ -z "$REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "No Supabase project: building without accounts."
            exit 0
          fi
          curl -sSf "https://api.supabase.com/v1/projects/$REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /tmp/keys.json
          # The public key: the legacy "anon" one if the project has it, else the new "publishable" one.
          key=$(jq -r '([.[] | select(.name == "anon" and (.api_key // "") != "")] + [.[] | select(.type == "publishable" and (.api_key // "") != "")])[0].api_key // empty' /tmp/keys.json)
          if [ -z "$key" ]; then echo "::error::No public key found in the Supabase project."; exit 1; fi
          echo "VITE_SUPABASE_URL=https://$REF.supabase.co" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_KEY=$key" >> "$GITHUB_ENV"
          echo "Accounts on: https://$REF.supabase.co"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
