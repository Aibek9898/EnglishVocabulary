name: Set up Supabase

# Creates the tables, closes public sign-up and deploys the admin function.
# Needs, in Settings → Secrets and variables → Actions:
#   variable SUPABASE_PROJECT_REF  (Project Settings → General → Project ID)
#   secret   SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens)
# Safe to run again: everything in it can be repeated.

on:
  push:
    branches: [main, claude/project-thread-39wedl]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_REF || 'eiuruohmwaqlavueucil' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - name: Check the settings
        run: |
          # A pasted value can carry a line break or spaces; drop them.
          REF=$(printf '%s' "$REF" | tr -d '[:space:]')
          TOKEN=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          if [ -z "$REF" ]; then echo "::error::Add the variable SUPABASE_PROJECT_REF (Settings → Secrets and variables → Actions → Variables)."; exit 1; fi
          if [ -z "$TOKEN" ]; then echo "::error::Add SUPABASE_ACCESS_TOKEN as a secret (Settings → Secrets and variables → Actions → Secrets tab, not Variables)."; exit 1; fi
          echo "::add-mask::$TOKEN"
          echo "REF=$REF" >> "$GITHUB_ENV"
          echo "SUPABASE_ACCESS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Create the tables and storage
        run: |
          jq -n --rawfile q supabase/schema.sql '{query: $q}' > /tmp/query.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data @/tmp/query.json)
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then cat /tmp/out.json; exit 1; fi

      - name: Close public sign-up
        run: |
          body=$(jq -n --arg site "$SITE_URL" '{disable_signup: true, site_url: $site, uri_allow_list: $site}')
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' --data "$body")
          echo "HTTP $code"
          if [ "$code" -ge 300 ]; then cat /tmp/out.json; exit 1; fi
          jq '{disable_signup, site_url}' /tmp/out.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy the admin function
        run: supabase functions deploy admin-users --project-ref "$REF" --use-api --no-verify-jwt
